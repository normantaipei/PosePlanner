# PosePlanner 私有 DB（自架）— PostgreSQL + 圖片/fragment 接收服務
#
# 啟動：
#   cd server
#   cp .env.example .env          # 改掉密碼與 token
#   docker compose up -d --build
#
# 之後在 Claude 端把 backend 指向 http://<這台機器的內網IP>:8000：
#   python3 scripts/backend.py set --backend selfhost \
#       --base-url http://192.168.x.x:8000 --token <你的 token>
#
# 資料持久化在 named volume（pgdata：Postgres；media：原圖+縮圖）。

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poseplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poseplanner}
      POSTGRES_DB: ${POSTGRES_DB:-poseplanner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poseplanner} -d ${POSTGRES_DB:-poseplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 預設不對外開 5432（只在 compose 內網給 api 用）。要從別台連 DB 再自行加 ports。

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-poseplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poseplanner}
      POSTGRES_DB: ${POSTGRES_DB:-poseplanner}
      POSEPLANNER_TOKEN: ${POSEPLANNER_TOKEN:-}
      POSEPLANNER_DATA: /data
    volumes:
      - media:/data
      # taxonomy.yaml 在 repo 根（server/ 之外）→ 唯讀掛進容器供 seed / 判定 active。
      - ../taxonomy.yaml:/app/taxonomy.yaml:ro
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
  media:
