# PosePlanner 私有 DB（自架）— PostgreSQL + 圖片/fragment 接收服務
#
# 啟動：
#   cd server
#   cp .env.example .env          # 改掉密碼與 token
#   docker compose up -d --build
#
# 之後在 Claude 端把 backend 指向 http://<這台機器的內網IP>:8000：
#   python3 scripts/backend.py set --backend selfhost \
#       --base-url http://192.168.x.x:8000 --token <你的 token>
#
# 資料持久化在 named volume（pgdata：Postgres；media：原圖+縮圖）。

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 完全停用 unix domain socket（空字串）：在 Proxmox 非特權 LXC 裡跑 Docker 時，
    # AppArmor/seccomp 會擋掉 AF_UNIX 的 bind()，導致 postgres 在任何目錄都建不了 socket
    # （/var/run/postgresql 跟 /tmp 都 Permission denied）。TCP 監聽不受影響，
    # api 與 healthcheck 都走 TCP（PGHOST=db / 127.0.0.1），不需要 unix socket。一般主機也無害。
    command: ["-c", "unix_socket_directories="]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poseplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poseplanner}
      POSTGRES_DB: ${POSTGRES_DB:-poseplanner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 走 TCP 而非預設 unix socket，配合上面 socket 改位
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-poseplanner} -d ${POSTGRES_DB:-poseplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 預設不對外開 5432（只在 compose 內網給 api 用）。要從別台連 DB 再自行加 ports。

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-poseplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poseplanner}
      POSTGRES_DB: ${POSTGRES_DB:-poseplanner}
      POSEPLANNER_TOKEN: ${POSEPLANNER_TOKEN:-}
      POSEPLANNER_READ_TOKEN: ${POSEPLANNER_READ_TOKEN:-}
      POSEPLANNER_CORS_ORIGINS: ${POSEPLANNER_CORS_ORIGINS:-*}
      POSEPLANNER_DATA: /data
      # /skill 下載端點：repo 在容器內的掛載點 + 額外放行的來源網段（選填，逗號分隔 CIDR）。
      POSEPLANNER_REPO: /repo
      POSEPLANNER_SKILL_ALLOW_CIDRS: ${POSEPLANNER_SKILL_ALLOW_CIDRS:-}
    volumes:
      - media:/data
      # repo 根唯讀掛進來：供 seed（taxonomy.yaml）與 /skill 即時打包（SKILL.md / scripts / vendor）。
      - ../:/repo:ro
      # taxonomy.yaml 維持掛在 /app 舊路徑（seed / 判定 active 用，相容既有設定）。
      - ../taxonomy.yaml:/app/taxonomy.yaml:ro
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
  media:
